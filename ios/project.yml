name: DocUpload
options:
  bundleIdPrefix: com.hdfc
targets:
  DocUpload:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - DocUpload
    info:
      path: DocUpload/Info.plist
      properties:
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hdfc.docupload
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
