name: Android CI

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: docupload-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Rename APK for release
        if: github.event_name == 'push'
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/docupload-debug.apk

      - name: Publish APK to GitHub Release (direct download link)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: DocUpload debug APK (latest build)
          body: |
            Latest debug APK, auto-published from CI on each push.
            Direct download: **docupload-debug.apk** (asset below).
            Requires Android 8.0+ (API 26). Enable "Install unknown apps" to sideload.
          files: app/build/outputs/apk/debug/docupload-debug.apk
